[project]
name = "invoice-cli"
version = "0.3.1"
description = "Turn a small YAML file of line items into a Markdown invoice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.scripts]
invoice = "invoice_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
